<!doctype html>
<!-- Local YouTube-style fixture. It contains no YouTube code or assets. -->
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiet Browse · YouTube adapter fixture</title>
    <link rel="stylesheet" href="/extension/ui/styles.css" />
    <link rel="stylesheet" href="fixture.css" />
    <link rel="stylesheet" href="/extension/content/presentation.css" />
  </head>
  <body class="document">
    <h1>YouTube adapter fixture</h1>
    <p>
      This is a local structural fixture, not YouTube. It tests DOM behavior, not compatibility with
      the live service.
    </p>
    <ytd-watch-flexy
      ><div id="movie_player">
        <video class="html5-main-video"></video>
        <div class="ytp-caption-window-container">Sample caption stays above cover</div>
        <div class="ytp-chrome-bottom">
          <button id="play" type="button">Native player control fixture</button
          ><button id="mute" type="button">Mute</button>
        </div>
      </div>
      <div id="related"><a href="#test-status">Original recommendation link</a></div>
      <ytd-thumbnail><div id="mouseover-overlay">Preview fixture</div></ytd-thumbnail>
      <div id="cinematics">Ambient fixture</div></ytd-watch-flexy
    >
    <p id="test-status" role="status">Running…</p>
    <ol id="results"></ol>
    <script src="harness.js"></script>
    <script src="/extension/shared/comfort.js"></script>
    <script src="/extension/content/comfort.js"></script>
    <script src="/extension/content/social.js"></script>
    <script src="/demo/engine-youtube.js"></script>
    <script src="youtube-tests.js"></script>
  </body>
</html>
