name: Bug report
description: Report behavior that is broken or inconsistent.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove account details, private messages, payment information, and other sensitive page content before submitting.
  - type: input
    id: version
    attributes:
      label: Quiet Browse version
      placeholder: 0.5.3
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome and operating-system versions
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Affected hostname
      description: Give only the hostname; do not include a private URL or query string.
      placeholder: www.youtube.com
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Enabled Quiet Browse settings
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private page content and account information.
          required: true
